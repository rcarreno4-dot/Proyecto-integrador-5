<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect id="fondo" x="0" y="0" width="1200" height="700" fill="#f4f6f8"/>
<rect id="marco" x="40" y="40" width="1120" height="620" fill="#ffffff" stroke="#c7ced8" stroke-width="3"/>
<g id="panel-contexto">
<rect id="panel-azul" x="75" y="75" width="500" height="550" fill="#0868ce"/>
<text id="marca" x="115" y="155" fill="#ffffff" font-family="Arial" font-size="42" font-weight="bold">SIGPRA</text>
<text id="titulo-contexto" x="115" y="215" fill="#ffffff" font-family="Arial" font-size="25" font-weight="bold">SIGPRA - Contexto</text>
<text id="subtitulo-contexto" x="115" y="250" fill="#ffffff" font-family="Arial" font-size="18">Gestion de practicas academicas</text>
<text id="descripcion" x="115" y="305" fill="#ffffff" font-family="Arial" font-size="17">Plataforma para registrar, validar y</text>
<text id="descripcion-2" x="115" y="332" fill="#ffffff" font-family="Arial" font-size="17">hacer seguimiento de practicas.</text>
<text id="rol-1" x="115" y="390" fill="#ffffff" font-family="Arial" font-size="16">• Estudiante: bitacora y evidencias</text>
<text id="rol-2" x="115" y="420" fill="#ffffff" font-family="Arial" font-size="16">• Docente: valida actividades y horas</text>
<text id="rol-3" x="115" y="450" fill="#ffffff" font-family="Arial" font-size="16">• Director: asigna y genera reportes</text>
</g>
<g id="formulario-login">
<rect id="panel-formulario" x="625" y="75" width="500" height="550" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
<text id="titulo-login" x="675" y="145" fill="#172b4d" font-family="Arial" font-size="30" font-weight="bold">Iniciar sesion</text>
<text id="label-correo" x="675" y="200" fill="#172b4d" font-family="Arial" font-size="16">Correo institucional</text>
<rect id="campo-correo" x="675" y="215" width="400" height="38" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
<text id="label-contrasena" x="675" y="300" fill="#172b4d" font-family="Arial" font-size="16">Contrasena</text>
<rect id="campo-contrasena" x="675" y="315" width="400" height="38" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
<text id="label-rol" x="675" y="400" fill="#172b4d" font-family="Arial" font-size="16">Rol</text>
<rect id="campo-rol" x="675" y="415" width="400" height="38" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
<text id="valor-rol" x="690" y="440" fill="#172b4d" font-family="Arial" font-size="15">Estudiante</text>
<rect id="boton-ingresar" x="675" y="485" width="400" height="45" fill="#0868ce"/>
<text id="texto-ingresar" x="875" y="514" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold">Ingresar</text>
<rect id="boton-registro" x="675" y="550" width="400" height="45" fill="#173f73"/>
<text id="texto-registro" x="875" y="579" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold">Registrarse como estudiante</text>
</g>
</svg>
