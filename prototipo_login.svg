  <style>text{font-family:Arial,sans-serif;fill:#172b4d}.label{font-size:14px}.small{font-size:12px}.title{font-size:24px;font-weight:bold}.button{font-size:14px;font-weight:bold;fill:white}</style>
  <rect width="1000" height="560" fill="#f4f6f8"/>
