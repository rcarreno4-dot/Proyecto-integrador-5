  <text x="550" y="306" class="label">Rol</text><rect x="550" y="318" width="350" height="30" fill="white" stroke="#98a2b3"/><text x="560" y="339" class="small">Estudiante</text>
  <text x="550" y="382" class="label">Modo de ejecucion</text><rect x="550" y="394" width="350" height="30" fill="white" stroke="#98a2b3"/><text x="560" y="415" class="small">REST (API)</text>
