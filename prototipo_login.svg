  <text x="92" y="132" fill="white" font-size="38" font-weight="bold">SIGPRA</text>
  <text x="92" y="178" fill="white" font-size="22" font-weight="bold">SIGPRA - Contexto del sistema</text>
  <text x="92" y="220" fill="white" font-size="15">Plataforma para registrar, validar y hacer seguimiento de practicas.</text>
  <text x="92" y="270" fill="white" font-size="14">• Registro publico: solo estudiantes</text>
  <text x="92" y="296" fill="white" font-size="14">• Estudiante: registra bitacora y evidencias</text>
  <text x="92" y="322" fill="white" font-size="14">• Docente: valida actividades y horas</text>
  <text x="92" y="348" fill="white" font-size="14">• Director: registra docentes y aprueba cierre</text>
  <rect x="520" y="60" width="410" height="440" fill="#fff" stroke="#eaecf0"/>
  <text x="550" y="112" class="title">Iniciar sesion</text>
