  <style>
    text{font-family:Arial,sans-serif;fill:#172b4d}.frame{fill:#fff;stroke:#b7c2d0;stroke-width:2}.bar{fill:#0868ce}.side{fill:#123f70}.white{fill:#fff}.label{font-size:11px}.small{font-size:10px}.head{font-size:16px;font-weight:bold}.title{font-size:22px;font-weight:bold}
