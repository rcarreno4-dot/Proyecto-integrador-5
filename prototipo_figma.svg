  <rect width="1600" height="1250" fill="#f4f6f8"/>
  <text x="60" y="48" class="title">SIGPRA - Prototipo de mediana fidelidad para Figma</text>
  <text x="60" y="72" class="small">Flujo principal por roles: estudiante, docente asesor y director</text>

  <g transform="translate(60 105)"><rect class="frame" width="350" height="250"/><rect class="bar" width="350" height="42"/><text x="18" y="28" class="white head">01  Inicio de sesion</text><text x="22" y="72" class="label">Correo institucional</text><rect x="22" y="80" width="306" height="23" fill="white" stroke="#98a2b3"/><text x="22" y="125" class="label">Contrasena</text><rect x="22" y="133" width="306" height="23" fill="white" stroke="#98a2b3"/><text x="22" y="178" class="label">Rol</text><rect x="22" y="186" width="306" height="23" fill="white" stroke="#98a2b3"/><rect x="22" y="220" width="145" height="24" fill="#0868ce"/><text x="94" y="237" text-anchor="middle" class="white small">Ingresar</text><rect x="183" y="220" width="145" height="24" fill="#173f73"/><text x="255" y="237" text-anchor="middle" class="white small">Autoregistro</text></g>

  <g transform="translate(445 105)"><rect class="frame" width="350" height="250"/><rect class="side" width="85" height="250"/><text x="12" y="28" class="white head">SIGPRA</text><text x="12" y="70" class="white small">Inicio</text><text x="12" y="94" class="white small">Mi perfil</text><text x="12" y="118" class="white small">Practica</text><text x="12" y="142" class="white small">Bitacora</text><text x="105" y="32" class="head">02  Autoregistro</text><text x="105" y="66" class="label">Nombre completo</text><rect x="105" y="73" width="220" height="21" fill="white" stroke="#98a2b3"/><text x="105" y="116" class="label">Correo institucional</text><rect x="105" y="123" width="220" height="21" fill="white" stroke="#98a2b3"/><text x="105" y="166" class="label">Contrasena</text><rect x="105" y="173" width="220" height="21" fill="white" stroke="#98a2b3"/><rect x="105" y="215" width="220" height="23" fill="#0868ce"/><text x="215" y="231" text-anchor="middle" class="white small">Crear cuenta</text></g>

  <g transform="translate(830 105)"><rect class="frame" width="350" height="250"/><rect class="side" width="85" height="250"/><text x="12" y="28" class="white head">SIGPRA</text><text x="12" y="70" class="white small">Resumen</text><text x="12" y="94" class="white small">Bitacora</text><text x="12" y="118" class="white small">Evidencias</text><text x="105" y="32" class="head">03  Dashboard estudiante</text><rect x="105" y="55" width="98" height="62" fill="#e8f0ff"/><text x="115" y="77" class="small">Horas aprobadas</text><text x="115" y="103" class="head">72 / 120</text><rect x="215" y="55" width="110" height="62" fill="#fff4e5"/><text x="225" y="77" class="small">Pendientes</text><text x="225" y="103" class="head">2</text><text x="105" y="145" class="label">Practica actual</text><rect x="105" y="153" width="220" height="22" fill="white" stroke="#98a2b3"/><text x="112" y="168" class="small">Institucion Educativa Central</text><text x="105" y="205" class="label">Avance del periodo</text><rect x="105" y="213" width="220" height="15" fill="#e8f0ff"/><rect x="105" y="213" width="132" height="15" fill="#0868ce"/></g>

  <g transform="translate(1215 105)"><rect class="frame" width="325" height="250"/><rect class="side" width="78" height="250"/><text x="10" y="27" class="white head">SIGPRA</text><text x="10" y="70" class="white small">Inicio</text><text x="10" y="94" class="white small">Bitacora</text><text x="10" y="118" class="white small">Evidencias</text><text x="92" y="32" class="head">04  Nueva bitacora</text><text x="92" y="66" class="label">Fecha</text><rect x="92" y="73" width="205" height="20" fill="white" stroke="#98a2b3"/><text x="92" y="114" class="label">Actividad</text><rect x="92" y="121" width="205" height="20" fill="white" stroke="#98a2b3"/><text x="92" y="162" class="label">Descripcion y horas</text><rect x="92" y="169" width="205" height="42" fill="white" stroke="#98a2b3"/><rect x="92" y="222" width="100" height="22" fill="#0868ce"/><text x="142" y="237" text-anchor="middle" class="white small">Guardar</text></g>

  <g transform="translate(60 405)"><rect class="frame" width="350" height="250"/><rect class="side" width="85" height="250"/><text x="12" y="28" class="white head">SIGPRA</text><text x="12" y="70" class="white small">Resumen</text><text x="12" y="94" class="white small">Pendientes</text><text x="105" y="32" class="head">05  Dashboard docente</text><rect x="105" y="58" width="98" height="58" fill="#fff4e5"/><text x="114" y="80" class="small">Por validar</text><text x="114" y="103" class="head">08</text><rect x="215" y="58" width="110" height="58" fill="#e8f0ff"/><text x="224" y="80" class="small">Estudiantes</text><text x="224" y="103" class="head">15</text><text x="105" y="145" class="label">Bitacoras recientes</text><rect x="105" y="154" width="220" height="22" fill="white" stroke="#d0d5dd"/><text x="112" y="169" class="small">Planeacion de clase     Pendiente</text><rect x="105" y="184" width="220" height="22" fill="white" stroke="#d0d5dd"/><text x="112" y="199" class="small">Refuerzo pedagogico     Pendiente</text></g>

  <g transform="translate(445 405)"><rect class="frame" width="350" height="250"/><rect class="bar" width="350" height="42"/><text x="18" y="28" class="white head">06  Validacion docente</text><text x="22" y="72" class="label">Actividad: Planeacion de clase</text><text x="22" y="100" class="label">Horas reportadas: 6</text><rect x="22" y="115" width="306" height="44" fill="white" stroke="#98a2b3"/><text x="30" y="137" class="small">Observacion del docente...</text><rect x="22" y="180" width="145" height="27" fill="#157347"/><text x="94" y="198" text-anchor="middle" class="white small">Aprobar</text><rect x="183" y="180" width="145" height="27" fill="#b42318"/><text x="255" y="198" text-anchor="middle" class="white small">Rechazar</text></g>

  <g transform="translate(830 405)"><rect class="frame" width="350" height="250"/><rect class="side" width="85" height="250"/><text x="12" y="28" class="white head">SIGPRA</text><text x="12" y="70" class="white small">Resumen</text><text x="12" y="94" class="white small">Asignaciones</text><text x="12" y="118" class="white small">Reportes</text><text x="105" y="32" class="head">07  Dashboard director</text><rect x="105" y="58" width="98" height="58" fill="#e8f0ff"/><text x="114" y="80" class="small">Practicas</text><text x="114" y="103" class="head">34</text><rect x="215" y="58" width="110" height="58" fill="#e8f0ff"/><text x="224" y="80" class="small">En curso</text><text x="224" y="103" class="head">27</text><text x="105" y="145" class="label">Alertas y pendientes</text><rect x="105" y="154" width="220" height="22" fill="white" stroke="#d0d5dd"/><text x="112" y="169" class="small">3 cierres por revisar</text><rect x="105" y="184" width="220" height="22" fill="white" stroke="#d0d5dd"/><text x="112" y="199" class="small">5 asignaciones pendientes</text></g>

  <g transform="translate(1215 405)"><rect class="frame" width="325" height="250"/><rect class="bar" width="325" height="42"/><text x="18" y="28" class="white head">08  Asignar practica</text><text x="22" y="72" class="label">Estudiante</text><rect x="22" y="80" width="280" height="22" fill="white" stroke="#98a2b3"/><text x="30" y="96" class="small">Seleccionar estudiante</text><text x="22" y="128" class="label">Docente asesor</text><rect x="22" y="136" width="280" height="22" fill="white" stroke="#98a2b3"/><text x="30" y="152" class="small">Seleccionar docente</text><text x="22" y="184" class="label">Entidad y periodo</text><rect x="22" y="192" width="280" height="22" fill="white" stroke="#98a2b3"/><text x="30" y="208" class="small">Entidad receptora / 2026-2</text><rect x="22" y="222" width="130" height="22" fill="#0868ce"/><text x="87" y="237" text-anchor="middle" class="white small">Guardar asignacion</text></g>

  <text x="60" y="720" class="title">Flujo sugerido</text><text x="60" y="750" class="small">01 Iniciar sesion -> 02 Autoregistro -> 03 Dashboard estudiante -> 04 Bitacora -> 05 Validacion -> 07 Dashboard director -> 08 Asignacion</text>
  <rect x="60" y="790" width="1480" height="360" fill="white" stroke="#d0d5dd"/>
  <text x="90" y="835" class="head">Notas para construirlo en Figma</text><text x="90" y="875" class="label">• Importa este archivo SVG en Figma para obtener la lámina de referencia.</text><text x="90" y="905" class="label">• Convierte cada pantalla en un frame independiente de 1440 x 900 para el prototipo navegable.</text><text x="90" y="935" class="label">• Conecta los botones: Ingresar, Autoregistro, Bitacora, Aprobar, Rechazar y Guardar asignacion.</text><text x="90" y="965" class="label">• Agrega las capturas finales en el Anexo E de la entrega académica.</text>
</svg>
