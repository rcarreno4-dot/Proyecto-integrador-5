version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: sigpra-postgres
    environment:
      POSTGRES_DB: sigpra_relational_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./databases/postgres/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
      - postgres_data:/var/lib/postgresql/data

  mongo-db:
    image: mongo:6.0
    container_name: sigpra-mongo
    environment:
      MONGO_INITDB_DATABASE: sigpra_nosql_db
    ports:
      - "27017:27017"
    volumes:
      - ./databases/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongo_data:/data/db

  auth-service:
    build: ./microservices/auth-service
    container_name: sigpra-auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres-db
      DB_NAME: sigpra_relational_db
      DB_USER: postgres
      DB_PASS: postgrespassword
    depends_on:
      - postgres-db

  academic-service:
    build: ./microservices/academic-service
    container_name: sigpra-academic-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres-db
      DB_NAME: sigpra_relational_db
      DB_USER: postgres
      DB_PASS: postgrespassword
    depends_on:
      - postgres-db

  activity-service:
    build: ./microservices/activity-service
    container_name: sigpra-activity-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo-db:27017/sigpra_nosql_db
    depends_on:
      - mongo-db

  evaluation-service:
    build: ./microservices/evaluation-service
    container_name: sigpra-evaluation-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres-db
      DB_NAME: sigpra_relational_db
      DB_USER: postgres
      DB_PASS: postgrespassword
    depends_on:
      - postgres-db

  portal-web:
    build: ./portal-web
    container_name: sigpra-portal-web
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - academic-service
      - activity-service
      - evaluation-service

volumes:
  postgres_data:
  mongo_data:
