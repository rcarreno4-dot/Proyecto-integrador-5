<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <style>
    text { font-family: Arial, sans-serif; fill: #1f2937; }
    .entity { fill: #ffffff; stroke: #2457a6; stroke-width: 2; }
    .title { fill: #2457a6; }
    .line { stroke: #667085; stroke-width: 2; fill: none; }
    .label { font-size: 15px; }
    .field { font-size: 13px; }
  </style>
  <rect width="1100" height="650" fill="#f7f8fa"/>
  <text x="550" y="38" text-anchor="middle" font-size="26" font-weight="bold">SIGPRA - Modelo Entidad-Relacion</text>
  <g transform="translate(40 90)">
    <rect class="entity" width="220" height="120" rx="4"/><rect class="title" width="220" height="32" rx="4"/>
    <text x="110" y="22" text-anchor="middle" fill="white" font-weight="bold">USUARIO</text><text class="field" x="14" y="58">PK id</text><text class="field" x="14" y="80">correo, nombre_completo</text><text class="field" x="14" y="102">rol, estado</text>
  </g>
  <g transform="translate(40 390)">
    <rect class="entity" width="220" height="120" rx="4"/><rect class="title" width="220" height="32" rx="4"/>
    <text x="110" y="22" text-anchor="middle" fill="white" font-weight="bold">PROGRAMA</text><text class="field" x="14" y="58">PK id</text><text class="field" x="14" y="80">nombre</text><text class="field" x="14" y="102">codigo</text>
  </g>
  <g transform="translate(400 250)">
    <rect class="entity" width="250" height="145" rx="4"/><rect class="title" width="250" height="32" rx="4"/>
    <text x="125" y="22" text-anchor="middle" fill="white" font-weight="bold">PRACTICA</text><text class="field" x="14" y="58">PK id</text><text class="field" x="14" y="80">FK estudiante_id, docente_id</text><text class="field" x="14" y="102">FK programa_id, entidad_id</text><text class="field" x="14" y="124">periodo, estado, horas</text>
  </g>
  <g transform="translate(790 90)">
    <rect class="entity" width="240" height="120" rx="4"/><rect class="title" width="240" height="32" rx="4"/>
    <text x="120" y="22" text-anchor="middle" fill="white" font-weight="bold">ENTIDAD_RECEPTORA</text><text class="field" x="14" y="58">PK id</text><text class="field" x="14" y="80">nombre, nit, direccion</text><text class="field" x="14" y="102">contacto, telefono</text>
  </g>
  <g transform="translate(790 300)">
    <rect class="entity" width="240" height="120" rx="4"/><rect class="title" width="240" height="32" rx="4"/>
    <text x="120" y="22" text-anchor="middle" fill="white" font-weight="bold">BITACORA</text><text class="field" x="14" y="58">PK id</text><text class="field" x="14" y="80">FK practica_id, fecha</text><text class="field" x="14" y="102">actividad, horas, estado</text>
  </g>
  <g transform="translate(790 510)">
    <rect class="entity" width="240" height="100" rx="4"/><rect class="title" width="240" height="32" rx="4"/>
    <text x="120" y="22" text-anchor="middle" fill="white" font-weight="bold">VALIDACION</text><text class="field" x="14" y="58">PK id, FK bitacora_id</text><text class="field" x="14" y="80">resultado, observacion</text>
  </g>
  <path class="line" d="M260 150 L400 290"/><text class="label" x="310" y="205">1 : N</text>
  <path class="line" d="M260 450 L400 355"/><text class="label" x="315" y="420">1 : N</text>
  <path class="line" d="M650 300 L790 150"/><text class="label" x="700" y="210">N : 1</text>
  <path class="line" d="M650 350 L790 350"/><text class="label" x="700" y="340">1 : N</text>
  <path class="line" d="M910 420 L910 510"/><text class="label" x="925" y="470">1 : N</text>
